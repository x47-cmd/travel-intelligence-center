<body>
  <div
    id="app"
    class="tic-app"
  >
    <header
      class="tic-topbar"
      role="banner"
    >
      <div class="tic-topbar-brand">
        <p class="tic-kicker">
          Travel Intelligence Center
        </p>

        <h1>
          مركز السفر الذكي
        </h1>
      </div>

      <button
        class="tic-icon-btn"
        type="button"
        data-route="more"
        aria-label="فتح صفحة المزيد"
        title="المزيد"
      >
        ⚙️
      </button>
    </header>

    <main
      id="app-view"
      class="tic-page"
      data-router-view
      aria-live="polite"
      aria-busy="true"
      tabindex="-1"
    >
      <section
        class="tic-empty-state"
        aria-labelledby="startup-title"
      >
        <div
          class="tic-empty-icon"
          aria-hidden="true"
        >
          ✈
        </div>

        <h2 id="startup-title">
          جاري تشغيل مركز السفر الذكي...
        </h2>

        <p>
          يتم تجهيز الرحلات، الرحلات المخططة، جواز السفر،
          دليل 195 دولة، الاقتراحات الذكية، الجداول السياحية،
          رصيد السفر، اقتراحات الوجهات حسب الرصيد،
          المصروفات، السحب والإيداع، المستندات،
          التجهيز، الذكريات، وقائمة الأمنيات.
        </p>

        <div
          class="tic-loading"
          aria-hidden="true"
        >
          <div class="tic-spinner"></div>
        </div>
      </section>
    </main>

    <nav
      class="tic-bottom-nav"
      data-bottom-nav
      aria-label="التنقل الرئيسي"
      role="navigation"
    >
      <button
        class="tic-nav-item active"
        type="button"
        data-route="home"
        aria-label="الرئيسية"
        aria-current="page"
      >
        <span aria-hidden="true">⌂</span>
        <small>الرئيسية</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="trips"
        aria-label="رحلاتي"
      >
        <span aria-hidden="true">✈</span>
        <small>رحلاتي</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="guide"
        aria-label="الدليل"
      >
        <span aria-hidden="true">◎</span>
        <small>الدليل</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="budget"
        aria-label="الميزانية"
      >
        <span aria-hidden="true">◈</span>
        <small>الميزانية</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="more"
        aria-label="المزيد"
      >
        <span aria-hidden="true">☰</span>
        <small>المزيد</small>
      </button>
    </nav>
  </div>

  <noscript>
    <section class="tic-empty-state">
      <div class="tic-empty-icon">!</div>

      <h2>JavaScript مطلوب</h2>

      <p>
        هذا التطبيق يحتاج إلى JavaScript للعمل.
      </p>
    </section>
  </noscript>
