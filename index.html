<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>مركز السفر الذكي | Travel Intelligence Center</title>

  <meta
    name="description"
    content="منصة شخصية ذكية لتنظيم الرحلات، الوجهات، الميزانيات، المصروفات، الادخار، الدفعات، التجهيز، المستندات، الذكريات، وقائمة الأمنيات في مكان واحد."
  />

  <meta name="theme-color" content="#0f766e" />
  <meta name="color-scheme" content="light" />
  <meta name="application-name" content="Travel Intelligence Center" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="Travel Center"
  />

  <!-- =====================================================
       Travel Intelligence Center V3.0.0

       Premium iPhone-first interface
       Smart next-trip summary V2.4.0
       Fast Single-Page Trip Form V4.1.0
       Ticket and hotel document import
       Guide Intelligence Platform V3.0.0
       Travel DNA and destination recommendations
       AI trip planner and annual travel planner
       Budget Intelligence Platform V3.0.0
       Expense, savings and payment intelligence
       Budget analytics, AI, alerts and notifications
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/style.css?v=2.3.1"
  />

  <!-- =====================================================
       1. Configuration and Base Data

       Required order:
       Config → Base Data
  ====================================================== -->

  <script
    defer
    src="js/config.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/data.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       2. Core Services

       Required order:
       Store → Router → UI

       Store V2.0.0 includes:
       - Complete trip persistence
       - Flight and hotel fields
       - Expense persistence
       - Savings persistence
       - Payment persistence
       - Budget Intelligence data
  ====================================================== -->

  <script
    defer
    src="js/store.js?v=2.0.0"
  ></script>

  <script
    defer
    src="js/router.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/ui.js?v=2.0.0"
  ></script>

  <!-- =====================================================
       3. Guide Intelligence Data Layer

       Required order:
       Countries Catalog → Travel Knowledge
  ====================================================== -->

  <script
    defer
    src="js/data/countries-catalog.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/data/travel-knowledge.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       4. Optional Document Reading Engines

       Tesseract.js:
       - OCR for ticket and hotel images

       PDF.js:
       - Text extraction from PDF bookings
  ====================================================== -->

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"
  ></script>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  ></script>

  <script>
    window.addEventListener(
      "DOMContentLoaded",
      function configurePdfWorker() {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }
      }
    );
  </script>

  <!-- =====================================================
       5. Smart Document Import Layer

       Required order:
       Reader → Ticket Import → Hotel Import → Trip Form
  ====================================================== -->

  <script
    defer
    src="js/features/document-reader.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/trip-ticket-import.js?v=1.1.0"
  ></script>

  <script
    defer
    src="js/features/hotel-import.js?v=1.1.0"
  ></script>

  <script
    defer
    src="js/features/trip-form.js?v=4.1.0"
  ></script>

  <!-- =====================================================
       6. Guide Intelligence Engines

       Required order:
       Recommendation
       → Search
       → AI Planner
       → Travel DNA
       → Year Planner
       → Guide Intelligence Orchestrator
  ====================================================== -->

  <script
    defer
    src="js/features/destination-recommendation-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/guide-search-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/guide-ai-planner.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/travel-dna.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/travel-year-planner.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/guide-intelligence.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       7. Budget Intelligence Platform Engines

       Required order:
       Budget Core
       → Expense Engine
       → Savings Engine
       → Analytics
       → Budget AI
       → Payment Tracker
       → Expense Alerts
       → Export Engine
       → Notification Engine
       → Integration Engine

       Important:
       The Integration Engine must load after all other
       Budget Intelligence engines.
  ====================================================== -->

  <script
    defer
    src="js/features/budget-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/expense-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/savings-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/budget-analytics.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/budget-ai.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/payment-tracker.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/expense-alert-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/budget-export-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/budget-notification-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/budget-integration-engine.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       8. Application Pages

       All core services, data layers and feature engines
       must load before the page modules.
  ====================================================== -->

  <script
    defer
    src="js/pages/home.js?v=2.4.0"
  ></script>

  <script
    defer
    src="js/pages/trips.js?v=2.0.0"
  ></script>

  <script
    defer
    src="js/pages/guide.js?v=3.0.0"
  ></script>

  <script
    defer
    src="js/pages/budget.js?v=3.0.0"
  ></script>

  <script
    defer
    src="js/pages/more.js?v=2.0.0"
  ></script>

  <!-- =====================================================
       9. Application Bootstrap

       Application Bootstrap V3.0.0:
       - Initializes Guide Intelligence
       - Initializes Budget Intelligence
       - Registers all pages
       - Starts the Router
       - Provides runtime diagnostics

       This must remain the final JavaScript file.
  ====================================================== -->

  <script
    defer
    src="js/app.js?v=3.0.0"
  ></script>
</head>

<body>
  <div
    id="app"
    class="tic-app"
  >
    <header
      class="tic-topbar"
      role="banner"
    >
      <div class="tic-topbar-brand">
        <p class="tic-kicker">
          Travel Intelligence Center
        </p>

        <h1>
          مركز السفر الذكي
        </h1>
      </div>

      <button
        class="tic-icon-btn"
        type="button"
        data-route="more"
        aria-label="فتح صفحة المزيد"
        title="المزيد"
      >
        ⚙️
      </button>
    </header>

    <main
      id="app-view"
      class="tic-page"
      data-router-view
      aria-live="polite"
      aria-busy="true"
      tabindex="-1"
    >
      <section
        class="tic-empty-state"
        aria-labelledby="startup-title"
      >
        <div
          class="tic-empty-icon"
          aria-hidden="true"
        >
          ✈
        </div>

        <h2 id="startup-title">
          جاري تشغيل مركز السفر الذكي...
        </h2>

        <p>
          يتم تجهيز الرحلات، الوجهات، الميزانيات،
          المصروفات، الادخار، الدفعات، المستندات،
          التجهيز، الذكريات، قائمة الأمنيات،
          ومحركات الذكاء الخاصة بالسفر والميزانية.
        </p>

        <div
          class="tic-loading"
          aria-hidden="true"
        >
          <div class="tic-spinner"></div>
        </div>
      </section>
    </main>

    <nav
      class="tic-bottom-nav"
      data-bottom-nav
      aria-label="التنقل الرئيسي"
      role="navigation"
    >
      <button
        class="tic-nav-item active"
        type="button"
        data-route="home"
        aria-label="الرئيسية"
        aria-current="page"
      >
        <span aria-hidden="true">⌂</span>
        <small>الرئيسية</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="trips"
        aria-label="رحلاتي"
      >
        <span aria-hidden="true">✈</span>
        <small>رحلاتي</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="guide"
        aria-label="الدليل"
      >
        <span aria-hidden="true">◎</span>
        <small>الدليل</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="budget"
        aria-label="الميزانية"
      >
        <span aria-hidden="true">◈</span>
        <small>الميزانية</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="more"
        aria-label="المزيد"
      >
        <span aria-hidden="true">☰</span>
        <small>المزيد</small>
      </button>
    </nav>
  </div>

  <noscript>
    <section class="tic-empty-state">
      <div class="tic-empty-icon">!</div>

      <h2>JavaScript مطلوب</h2>

      <p>
        هذا التطبيق يحتاج إلى JavaScript للعمل.
      </p>
    </section>
  </noscript>
</body>
</html>
