<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>مركز السفر الذكي | Travel Intelligence Center</title>

  <meta
    name="description"
    content="منصة شخصية ذكية لتنظيم الرحلات، الوجهات، الميزانيات، التجهيز، المستندات، الذكريات، وقائمة الأمنيات في مكان واحد."
  />

  <meta name="theme-color" content="#0f766e" />
  <meta name="color-scheme" content="light" />
  <meta name="application-name" content="Travel Intelligence Center" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />
  <meta
    name="apple-mobile-web-app-title"
    content="Travel Center"
  />

  <!-- =====================================================
       Travel Intelligence Center V2.5.0
       Premium iPhone-first interface
       Smart next-trip summary V2.4.0
       Fast Single-Page Trip Form V4.1.0
       Ticket and hotel document import
       Guide Intelligence Platform V3.0.0
       Travel DNA and destination recommendations
       AI trip planner and annual travel planner
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/style.css?v=2.3.1"
  />

  <!-- =====================================================
       1. Configuration and Base Data
  ====================================================== -->
  <script
    defer
    src="js/config.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/data.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       2. Core Services
       Store → Router → UI
  ====================================================== -->
  <script
    defer
    src="js/store.js?v=1.1.0"
  ></script>

  <script
    defer
    src="js/router.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/ui.js?v=2.0.0"
  ></script>

  <!-- =====================================================
       3. Guide Intelligence Data Layer
       Countries Catalog → Travel Knowledge
  ====================================================== -->
  <script
    defer
    src="js/data/countries-catalog.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/data/travel-knowledge.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       4. Optional Document Reading Engines
       Tesseract.js: OCR for ticket/hotel images
       PDF.js: text extraction from PDF bookings
  ====================================================== -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"
  ></script>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  ></script>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
    });
  </script>

  <!-- =====================================================
       5. Smart Document Import Layer
       Reader → Ticket Import → Hotel Import → Trip Form
  ====================================================== -->
  <script
    defer
    src="js/features/document-reader.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/trip-ticket-import.js?v=1.1.0"
  ></script>

  <script
    defer
    src="js/features/hotel-import.js?v=1.1.0"
  ></script>

  <script
    defer
    src="js/features/trip-form.js?v=4.1.0"
  ></script>

  <!-- =====================================================
       6. Guide Intelligence Engines
       Recommendation → Search → AI Planner → Travel DNA
       → Year Planner → Guide Intelligence Orchestrator
  ====================================================== -->
  <script
    defer
    src="js/features/destination-recommendation-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/guide-search-engine.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/guide-ai-planner.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/travel-dna.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/travel-year-planner.js?v=1.0.0"
  ></script>

  <script
    defer
    src="js/features/guide-intelligence.js?v=1.0.0"
  ></script>

  <!-- =====================================================
       7. Application Pages
       All page dependencies must load before these files.
  ====================================================== -->
  <script
    defer
    src="js/pages/home.js?v=2.4.0"
  ></script>

  <script
    defer
    src="js/pages/trips.js?v=2.0.0"
  ></script>

  <script
    defer
    src="js/pages/guide.js?v=3.0.0"
  ></script>

  <script
    defer
    src="js/pages/budget.js?v=2.0.0"
  ></script>

  <script
    defer
    src="js/pages/more.js?v=2.0.0"
  ></script>

  <!-- =====================================================
       8. Application Bootstrap
       Must remain the final JavaScript file.
  ====================================================== -->
  <script
    defer
    src="js/app.js?v=2.1.0"
  ></script>
</head>

<body>
  <div
    id="app"
    class="tic-app"
  >
    <header
      class="tic-topbar"
      role="banner"
    >
      <div class="tic-topbar-brand">
        <p class="tic-kicker">
          Travel Intelligence Center
        </p>

        <h1>
          مركز السفر الذكي
        </h1>
      </div>

      <button
        class="tic-icon-btn"
        type="button"
        data-route="more"
        aria-label="فتح صفحة المزيد"
        title="المزيد"
      >
        ⚙️
      </button>
    </header>

    <main
      id="app-view"
      class="tic-page"
      data-router-view
      aria-live="polite"
      aria-busy="true"
      tabindex="-1"
    >
      <section
        class="tic-empty-state"
        aria-labelledby="startup-title"
      >
        <div
          class="tic-empty-icon"
          aria-hidden="true"
        >
          ✈
        </div>

        <h2 id="startup-title">
          جاري تشغيل مركز السفر الذكي...
        </h2>

        <p>
          يتم تجهيز الرحلات، الوجهات، الميزانيات،
          المستندات، التجهيز، الذكريات، قائمة الأمنيات،
          ومحركات دليل السفر الذكي.
        </p>

        <div
          class="tic-loading"
          aria-hidden="true"
        >
          <div class="tic-spinner"></div>
        </div>
      </section>
    </main>

    <nav
      class="tic-bottom-nav"
      data-bottom-nav
      aria-label="التنقل الرئيسي"
      role="navigation"
    >
      <button
        class="tic-nav-item active"
        type="button"
        data-route="home"
        aria-label="الرئيسية"
        aria-current="page"
      >
        <span aria-hidden="true">⌂</span>
        <small>الرئيسية</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="trips"
        aria-label="رحلاتي"
      >
        <span aria-hidden="true">✈</span>
        <small>رحلاتي</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="guide"
        aria-label="الدليل"
      >
        <span aria-hidden="true">◎</span>
        <small>الدليل</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="budget"
        aria-label="الميزانية"
      >
        <span aria-hidden="true">◈</span>
        <small>الميزانية</small>
      </button>

      <button
        class="tic-nav-item"
        type="button"
        data-route="more"
        aria-label="المزيد"
      >
        <span aria-hidden="true">☰</span>
        <small>المزيد</small>
      </button>
    </nav>
  </div>

  <noscript>
    <section class="tic-empty-state">
      <div class="tic-empty-icon">!</div>

      <h2>JavaScript مطلوب</h2>

      <p>
        هذا التطبيق يحتاج إلى JavaScript للعمل.
      </p>
    </section>
  </noscript>
</body>
</html>
